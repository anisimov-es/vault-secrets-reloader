{{- if not (has .Values.mode (list "legacy" "namespaced")) }}{{ fail "mode must be legacy or namespaced" }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault-secrets-reloader.fullname" . }}
  labels:
    {{- include "vault-secrets-reloader.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.mode "namespaced" }}
  # A standby is not Ready until it acquires the leader Lease. Permit the old
  # leader to terminate during an update so a single-replica rollout can finish.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "vault-secrets-reloader.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "vault-secrets-reloader.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vault-secrets-reloader.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
{{- if or .Values.volumes (eq .Values.mode "namespaced") }}
      volumes:
{{- if eq .Values.mode "namespaced" }}
        - name: vault-login-jwt
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.namespaced.vaultAudience | quote }}
                  expirationSeconds: 600
{{- end }}
{{- with .Values.volumes }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - vault-secrets-reloader
            - -log-level
            - {{ .Values.logLevel }}
            {{- if .Values.enableJSONLog }}
            - -enable-json-log
            {{- end }}
            - -collector-sync-period
            - {{ .Values.collectorSyncPeriod }}
            - -reloader-run-period
            - {{ .Values.reloaderRunPeriod }}
            {{- if eq .Values.mode "namespaced" }}
            - --mode=namespaced
            - {{ printf "--vault-address-allowlist=%s" (join "," .Values.namespaced.vaultAddressAllowlist) | quote }}
            - {{ printf "--allow-http-vault=%v" .Values.namespaced.allowHTTPVault | quote }}
            - {{ printf "--vault-auth-source=%s" .Values.namespaced.vaultAuthSource | quote }}
            - {{ printf "--vault-audience=%s" .Values.namespaced.vaultAudience | quote }}
            - {{ printf "--vault-jwt-file=%s" .Values.namespaced.vaultJWTFile | quote }}
            - {{ printf "--vault-ca-file=%s" .Values.namespaced.vaultCAFile | quote }}
            - {{ printf "--allow-token-request=%v" .Values.namespaced.allowTokenRequest | quote }}
            - {{ printf "--vault-serviceaccount-allowlist=%s" (join "," .Values.namespaced.serviceAccountAllowlist) | quote }}
            - {{ printf "--allow-ca-secret-reads=%v" .Values.namespaced.allowCASecretReads | quote }}
            - {{ printf "--vault-ca-secret-allowlist=%s" (join "," .Values.namespaced.caSecretAllowlist) | quote }}
            - {{ printf "--leader-elect=%v" .Values.namespaced.leaderElection | quote }}
            - {{ printf "--leader-election-name=%s" (include "vault-secrets-reloader.fullname" .) | quote }}
            - {{ printf "--vault-poll-interval=%s" .Values.namespaced.pollInterval | quote }}
            - {{ printf "--access-check-interval=%s" .Values.namespaced.accessCheckInterval | quote }}
            - {{ printf "--cache-sync-timeout=%s" .Values.namespaced.cacheSyncTimeout | quote }}
            - {{ printf "--request-timeout=%s" .Values.namespaced.requestTimeout | quote }}
            - {{ printf "--rollout-timeout=%s" .Values.namespaced.rolloutTimeout | quote }}
            - {{ printf "--max-namespaces=%v" .Values.namespaced.maxNamespaces | quote }}
            - {{ printf "--max-targets=%v" .Values.namespaced.maxTargets | quote }}
            - {{ printf "--max-paths=%v" .Values.namespaced.maxPaths | quote }}
            - {{ printf "--max-cache-entries=%v" .Values.namespaced.maxCacheEntries | quote }}
            - {{ printf "--max-state-bytes=%v" .Values.namespaced.maxStateBytes | quote }}
            - {{ printf "--poll-workers=%v" .Values.namespaced.pollWorkers | quote }}
            - {{ printf "--poll-workers-per-vault=%v" .Values.namespaced.pollWorkersPerVault | quote }}
            - {{ printf "--poll-workers-per-namespace=%v" .Values.namespaced.pollWorkersPerNamespace | quote }}
            - {{ printf "--vault-qps=%v" .Values.namespaced.vaultQPS | quote }}
            {{- end }}
          env:
            {{- if eq .Values.mode "namespaced" }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            - name: LISTEN_ADDRESS
              value: ":{{ .Values.service.internalPort }}"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.internalPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.internalPort }}
          readinessProbe:
            httpGet:
              path: {{ if eq .Values.mode "namespaced" }}/readyz{{ else }}/{{ end }}
              port: {{ .Values.service.internalPort }}
{{- if or .Values.volumeMounts (eq .Values.mode "namespaced") }}
          volumeMounts:
{{- if eq .Values.mode "namespaced" }}
            - name: vault-login-jwt
              mountPath: /var/run/secrets/vault
              readOnly: true
{{- end }}
{{- with .Values.volumeMounts }}
{{ toYaml . | indent 12 }}
{{- end }}
{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
